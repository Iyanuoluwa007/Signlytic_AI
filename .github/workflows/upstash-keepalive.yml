name: Keep Upstash Redis Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Upstash Redis
        env:
          UPSTASH_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          # Strip trailing slash if present
          BASE_URL="${UPSTASH_URL%/}"
          echo "Pinging: ${BASE_URL}/PING"
          
          RESPONSE=$(curl -sf "${BASE_URL}/PING" \
            -H "Authorization: Bearer ${UPSTASH_TOKEN}" \
            2>&1) || {
            echo "::error::Curl failed. Response: $RESPONSE"
            echo "Check UPSTASH_REDIS_REST_URL format: https://xxx.upstash.io"
            echo "Check UPSTASH_REDIS_REST_TOKEN is the REST token not Redis password"
            exit 1
          }
          
          echo "Response: $RESPONSE"
          echo "Redis kept alive successfully"
