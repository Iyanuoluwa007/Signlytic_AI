name: Keep Upstash Redis Alive
on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Upstash Redis
        env:
          UPSTASH_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "${UPSTASH_URL}" ]; then
            echo "::error::UPSTASH_REDIS_REST_URL secret is empty or not set"
            exit 1
          fi
          if [ -z "${UPSTASH_TOKEN}" ]; then
            echo "::error::UPSTASH_REDIS_REST_TOKEN secret is empty or not set"
            exit 1
          fi

          BASE_URL=$(echo -n "${UPSTASH_URL}" | tr -d '[:space:]')
          BASE_URL="${BASE_URL%/}"

          echo "URL length: ${#BASE_URL}"
          case "${BASE_URL}" in
            https://*.upstash.io) echo "URL format looks correct (https + upstash.io)";;
            https://*) echo "::warning::https but host is not *.upstash.io";;
            *) echo "::error::URL does not start with https:// — check the secret";;
          esac

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "${BASE_URL}/ping" \
            -H "Authorization: Bearer ${UPSTASH_TOKEN}")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Body: $(cat /tmp/resp.txt)"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Ping failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Redis kept alive successfully"
