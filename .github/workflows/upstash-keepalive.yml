name: Keep Upstash Redis Alive

on:
  schedule:
    # Run every 5 days at 08:00 UTC
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Upstash Redis
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.UPSTASH_REDIS_REST_URL }}/PING" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $BODY (HTTP $HTTP_CODE)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Ping failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Redis kept alive successfully"
