<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data: https://signlytic-ai-website.vercel.app https://github.com https://*.githubusercontent.com; img-src 'self' data: blob:">
<title>Signlytic AI Desktop</title>
<style>
  body {
    margin: 0;
    background: #06080f;
    color: #d7e2ea;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 14px 0 6px; }
  #avatar-wrap {
    position: relative;
    width: 480px;
    height: 400px;
    border: 1px solid #17313f;
    border-radius: 8px;
    overflow: hidden;
    background: #06080f;
  }
  #avatar-wrap canvas { width: 100%; height: 100%; display: block; }
  canvas.hidden { display: none; }
  #mode-row {
    display: flex;
    gap: 6px;
    width: 480px;
    margin: 8px 0 4px;
    align-items: center;
  }
  .mode-btn {
    background: #0b1420;
    color: #6fa3b8;
    border: 1px solid #17313f;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .mode-btn.active { background: #0e7c6b; color: #eafffa; border-color: #0e7c6b; }
  #gloss-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    width: 480px;
    min-height: 18px;
    margin-bottom: 4px;
  }
  .gloss {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.05);
    color: #6fa3b8;
  }
  .gloss.active { background: #0e7c6b; color: #fff; }
  #status { font-size: 12px; color: #6fa3b8; margin: 6px 0; min-height: 16px; }
  #captions-row {
    display: flex;
    gap: 8px;
    width: 480px;
    align-items: center;
    margin-bottom: 8px;
  }
  #captions-toggle {
    background: #0e7c6b;
    color: #eafffa;
    border: 0;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #captions-toggle.on { background: #7c1d1d; }
  #captions-toggle:disabled { opacity: 0.4; cursor: default; }
  button.secondary {
    background: #0b1420;
    color: #8fb3c4;
    border: 1px solid #17313f;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  #captions-state { font-size: 11px; color: #6fa3b8; margin-left: auto; }
  #manual-row { display: flex; gap: 8px; width: 480px; }
  #manual-input {
    flex: 1;
    background: #0b1420;
    color: #d7e2ea;
    border: 1px solid #17313f;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
  }
  #manual-send {
    background: #0e7c6b;
    color: #eafffa;
    border: 0;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  #caption-log {
    width: 480px;
    margin-top: 10px;
    font-size: 12px;
    color: #8fb3c4;
    overflow-y: auto;
    flex: 1;
  }
  footer { font-size: 10px; color: #43606f; padding: 8px; }
</style>
</head>
<body>
<h1>Signlytic AI Desktop</h1>

<div id="avatar-wrap">
  <canvas id="canvas-2d"></canvas>
  <canvas id="canvas-3d" class="hidden"></canvas>
</div>

<div id="mode-row">
  <button id="mode-2d" class="mode-btn active">2D Skeleton</button>
  <button id="mode-3d" class="mode-btn">3D Avatar</button>
  <span id="status">Starting...</span>
</div>

<div id="gloss-strip"></div>

<div id="captions-row">
  <button id="captions-toggle">Start Live Captions</button>
  <button id="captions-launch" class="secondary">Open Live Captions</button>
  <span id="captions-state">captions off</span>
</div>

<div id="manual-row">
  <input id="manual-input" type="text" placeholder="Type text to sign (works on every platform)">
  <button id="manual-send">Send</button>
</div>

<div id="caption-log"></div>
<footer>Signlytic AI - Independent Robotics &amp; AI Systems Engineer</footer>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/avatar3d.js"></script>
<script src="vendor/skeleton2d.js"></script>
<script type="module" src="converter-bridge.js"></script>
<script src="sign-source.js"></script>
<script src="desktop.js"></script>
</body>
</html>
