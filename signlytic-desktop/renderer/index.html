<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data: https://signlytic-ai-website.vercel.app https://github.com https://*.githubusercontent.com; img-src 'self' data: blob:">
<title>Signlytic AI Desktop</title>
<style>
  /* The window itself is transparent; everything visible is the panel below,
     which is what gives the Live Captions look. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    color: #d7e2ea;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  #panel {
    height: 100%;
    /* Containing block for the settings overlay below. */
    position: relative;
    display: flex;
    flex-direction: column;
    background: rgba(8, 11, 18, 0.82);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    overflow: hidden;
  }

  /* Frameless: this strip is what the user grabs to move the window. */
  #titlebar {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    flex: 0 0 auto;
  }
  #title { font-size: 11px; font-weight: 600; color: #5eead4; letter-spacing: 0.02em; }
  #titlebar .spacer { flex: 1; }
  button, select { -webkit-app-region: no-drag; }

  .seg {
    display: flex;
    gap: 2px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 6px;
    padding: 2px;
  }
  .seg button {
    background: transparent;
    color: #6fa3b8;
    border: 0;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .seg button.active { background: #0e7c6b; color: #eafffa; }

  .winbtn {
    background: transparent;
    color: rgba(255,255,255,0.35);
    border: 0;
    font-size: 14px;
    line-height: 1;
    padding: 2px 7px;
    cursor: pointer;
    border-radius: 4px;
  }
  .winbtn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .winbtn.danger:hover { background: #7c1d1d; color: #fff; }
  /* The gear is an inline SVG so it inherits the button colour and stays crisp
     at any scaling, and so the title bar carries no text label for it. */
  #settings-btn { display: inline-flex; align-items: center; padding: 3px 6px; }
  #settings-btn.open { background: rgba(255,255,255,0.10); color: #5eead4; }

  /* Settings overlay. Anchored under the title bar and floated above the
     stage, so opening it never resizes the signer. */
  #settings {
    display: none;
    position: absolute;
    top: 32px;
    right: 6px;
    left: 6px;
    z-index: 20;
    -webkit-app-region: no-drag;
    background: rgba(12, 17, 25, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    padding: 8px;
    max-height: calc(100% - 44px);
    overflow-y: auto;
  }
  #settings.open { display: block; }

  /* Label above its control, in every row. The five position buttons cannot
     sit beside a label at the snapped width of 420px, and mixing the two
     arrangements left the panel looking misaligned. */
  .set-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 5px;
    padding: 4px 2px 6px;
  }
  .set-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6fa3b8;
  }
  /* flex-basis 0 rather than auto, so the buttons come out equal width instead
     of being sized by their labels ("Bot L" against "Float"). */
  .set-row .seg button { flex: 1 1 0; padding: 5px 6px; }

  .set-sep {
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    margin: 8px 2px 6px;
  }

  .set-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px;
    font-size: 12px;
    color: #d7e2ea;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .set-check input { accent-color: #0e7c6b; width: 14px; height: 14px; cursor: pointer; }
  .set-note {
    margin: 4px 2px 2px;
    font-size: 10px;
    line-height: 1.45;
    color: #6b8798;
  }
  .set-check.disabled, .set-check.disabled + .set-note { opacity: 0.45; cursor: default; }
  /* Whole settings rows that do not apply to this platform are removed rather
     than greyed out. A disabled control still reads as something you could
     have, and neither of these is available on the other OS. */
  .set-gone { display: none !important; }

  /* The signer is the point of the app, so it always sits directly under the
     title bar and above the controls, and never collapses to nothing when the
     window is short. Controls stay pinned below it. */
  #stage { flex: 1 1 auto; position: relative; min-height: 140px; overflow: hidden; }
  /* Three.js setSize writes inline width/height on the canvas, and an inline
     style beats a stylesheet rule. Left alone the canvas keeps its own pixel
     size, spills out of the stage and covers the controls below, which then
     cannot be clicked. Pinning it to the stage and forcing the size keeps it
     inside no matter what the renderer writes. */
  #stage canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  /* Must out-specify the "#stage canvas" rule above, which sets display:block.
     A plain ".hidden" loses to it, leaving the 3D canvas painted on top of
     the 2D one after switching renderer. */
  #stage canvas.hidden { display: none; }

  #glosses {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    padding: 0 8px 4px;
    flex: 0 0 auto;
  }
  .gloss {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.06);
    color: #7fb0c4;
  }
  .gloss.active { background: #0e7c6b; color: #fff; }

  #controls {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    flex: 0 0 auto;
  }
  #manual-input {
    flex: 1;
    min-width: 0;
    background: rgba(255, 255, 255, 0.05);
    color: #d7e2ea;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    -webkit-app-region: no-drag;
    user-select: text;
  }
  /* Sits with the playback controls rather than in the title bar: at the
     snapped width of 420px the title bar already has no room to spare. */
  #speed {
    background: rgba(255, 255, 255, 0.05);
    color: #d7e2ea;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    padding: 4px 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    flex: 0 0 auto;
  }
  #speed option { background: #0d1219; color: #d7e2ea; }

  #captions-toggle {
    background: #0e7c6b;
    color: #eafffa;
    border: 0;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #captions-toggle.on { background: #7c1d1d; }
  #captions-toggle:disabled { opacity: 0.4; cursor: default; }
  #status { font-size: 10px; color: #6fa3b8; padding: 0 8px 6px; min-height: 12px; flex: 0 0 auto; }
</style>
</head>
<body>
<div id="panel">
  <div id="titlebar">
    <span id="title">Signlytic AI</span>
    <span class="spacer"></span>
    <button class="winbtn" id="settings-btn" title="Settings"
            aria-label="Settings" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M8 5.4a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2zm0 4.1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
        <path fill="currentColor" d="M14 8c0-.36-.03-.71-.09-1.05l1.32-.98-1.4-2.42-1.53.6a5.9 5.9 0 0 0-1.82-1.05L10.24 1.5H7.44l-.24 1.6a5.9 5.9 0 0 0-1.82 1.05l-1.53-.6-1.4 2.42 1.32.98a6.1 6.1 0 0 0 0 2.1l-1.32.98 1.4 2.42 1.53-.6c.54.45 1.16.81 1.82 1.05l.24 1.6h2.8l.24-1.6a5.9 5.9 0 0 0 1.82-1.05l1.53.6 1.4-2.42-1.32-.98c.06-.34.09-.69.09-1.05zm-1.63 1.5.24.62 1 .74-.4.7-1.16-.46-.5.44c-.44.38-.95.68-1.5.87l-.63.22-.18 1.21h-.8l-.18-1.21-.63-.22a4.8 4.8 0 0 1-1.5-.87l-.5-.44-1.16.46-.4-.7 1-.74.24-.62a5 5 0 0 1 0-1.72l-.24-.62-1-.74.4-.7 1.16.46.5-.44c.44-.38.95-.68 1.5-.87l.63-.22.18-1.21h.8l.18 1.21.63.22c.55.19 1.06.49 1.5.87l.5.44 1.16-.46.4.7-1 .74-.24.62a5 5 0 0 1 0 1.72z"/>
      </svg>
    </button>
    <button class="winbtn" id="win-min" title="Minimise">&#8211;</button>
    <button class="winbtn danger" id="win-close" title="Close">&#215;</button>
  </div>

  <!-- Opened from the gear. Overlays the stage rather than pushing the layout
       around, so the signer never jumps when settings are opened. -->
  <div id="settings" role="dialog" aria-label="Settings" aria-modal="false">
    <div class="set-row">
      <span class="set-label">Renderer</span>
      <div class="seg" id="mode-seg">
        <button id="mode-2d" class="active">2D</button>
        <button id="mode-3d">3D</button>
      </div>
    </div>

    <div class="set-row">
      <span class="set-label">Position</span>
      <div class="seg" id="pos-seg">
        <button id="pos-top-left">Top L</button>
        <button id="pos-top-right">Top R</button>
        <button id="pos-bottom-left">Bot L</button>
        <button id="pos-bottom-right">Bot R</button>
        <button id="pos-float" class="active">Float</button>
      </div>
    </div>

    <div class="set-sep"></div>

    <!-- macOS only. Shown by desktop.js when the caption source turns out to
         be speech recognition; hidden on Windows, where Live Captions decides
         what it listens to and the checkbox below is the relevant control. -->
    <div class="set-row set-gone" id="audio-source-row">
      <span class="set-label">Listen to</span>
      <div class="seg" id="audio-source-seg">
        <button id="audio-mic" class="active">Microphone</button>
        <button id="audio-system">System audio</button>
      </div>
    </div>
    <p class="set-note set-gone" id="audio-source-note"></p>

    <label class="set-check" for="mic-audio">
      <input type="checkbox" id="mic-audio" checked>
      <span>Include microphone audio</span>
    </label>
    <p class="set-note" id="mic-note">
      Live Captions forgets this option every time it starts, so the app sets it
      for you. It adds your own microphone as a caption source, so your side of
      a conversation is signed too. Turn it off to leave the option untouched.
    </p>
  </div>

  <div id="stage">
    <canvas id="canvas-2d"></canvas>
    <canvas id="canvas-3d" class="hidden"></canvas>
  </div>

  <div id="glosses"></div>
  <div id="status">Starting...</div>

  <div id="controls">
    <button id="captions-toggle">Start Live Captions</button>
    <select id="speed" title="Signing speed" aria-label="Signing speed">
      <option value="1">1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="1.75">1.75x</option>
      <option value="2">2x</option>
    </select>
    <input id="manual-input" type="text" placeholder="or type text to sign">
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/avatar3d.js"></script>
<script src="vendor/skeleton2d.js"></script>
<script type="module" src="converter-bridge.js"></script>
<script src="sign-source.js"></script>
<script src="desktop.js"></script>
</body>
</html>
